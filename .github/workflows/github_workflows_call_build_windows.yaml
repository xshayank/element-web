    uses: element-hq/element-web/.github/workflows/build_desktop_prepare.yaml@develop

  build-windows:
    needs: prepare
    uses: element-hq/element-web/.github/workflows/build_desktop_windows.yaml@develop
    with:
      arch: "x64"
